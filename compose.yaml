services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase_db:
    image: postgres:16-alpine
    container_name: erp_metabase_db
    environment:
      POSTGRES_DB: ${METABASE_APP_DB_NAME:-metabaseappdb}
      POSTGRES_USER: ${METABASE_APP_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${METABASE_APP_DB_USER:-metabase} -d ${METABASE_APP_DB_NAME:-metabaseappdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:v0.57.7.x
    container_name: erp_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabaseappdb}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_APP_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD}
      MB_DB_HOST: metabase_db
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
      JAVA_TIMEZONE: ${TZ:-Asia/Kolkata}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      metabase_db:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  metabase_postgres_data:
