[project]
name = "naari-admin"
version = "0.1.0"
description = "NAARI is a survey platform for measuring women's empowerment, agency and resilience in agriculture."
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.4",
    "django-tenants>=3.10.1",
    "gunicorn>=23.0.0",
    "django-components>=0.141.2",
    "django-filter>=25.1",
    "django-graphql-jwt>=0.4.0",
    "django-guardian>=3.0.3",
    "django-htmlmin>=0.11.0",
    "django-solo>=2.4.0",
    "graphene-django>=3.2.3",
    "pillow>=11.3.0",
    "requests>=2.31.0",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.0",
    "markdown>=3.6",
    "openpyxl>=3.1.5",
    "weasyprint>=66.0",
    "polib>=1.2.0",
    "pdf2image>=1.17.0",
    "openai>=1.99.9",
    "pypdf2>=3.0.1",
    "pymupdf>=1.26.3",
    "reportlab>=4.4.3",
    "python-pptx>=1.0.2",
    "pandas>=2.3.2",
    "python-docx>=1.1.0",
    "sentry-sdk>=2.58.0",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "anthropic>=0.52.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "djlint>=1.36.4",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''
