{% load i18n %}
<!-- Hint Edit Modal -->
<div x-show="editingHint"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     @click.self="editingHint = null">
  <div class="bg-card rounded-lg p-6 w-full max-w-lg md:max-w-xl mx-4 border border-border max-h-[90vh] overflow-y-auto"
       @click.stop
       x-trap="editingHint">
    <template x-if="editingHint">
      <div>
        <h3 class="text-lg font-semibold mb-4 text-card-foreground flex items-center gap-2">
          <i class="fa fa-lightbulb-o text-primary"></i>
          Edit Hint
        </h3>

        <div class="space-y-4">
          <div class="bg-muted/50 rounded-lg p-3">
            <p class="text-sm text-muted-foreground mb-1">{% trans "Question:" %}</p>
            <p class="font-medium text-card-foreground" x-text="getQuestionById(editingHint.id)?.text || ''"></p>
          </div>

          <div>
            <label class="block text-xs font-medium mb-1 text-muted-foreground">{% trans "Hint (optional)" %}</label>
            <textarea x-model="editingHint.hint"
                      class="form-control text-sm"
                      rows="3"
                      placeholder="{% trans 'Short helper text to guide respondents (max 1000 characters)' %}"></textarea>
            <!-- Unknown variables and tools -->
            <div class="mt-2 space-y-2">
              <template x-if="getUnknownVars(editingHint.hint, editingHint.id).length > 0">
                <div class="text-xs text-destructive">
                  Unknown variables:
                  <template x-for="v in getUnknownVars(editingHint.hint, editingHint.id)" :key="v">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 border border-destructive/40 rounded bg-destructive/10 text-destructive mr-1">{% templatetag openvariable %}<span x-text="v"></span>{% templatetag closevariable %}</span>
                  </template>
                </div>
              </template>
              <div class="flex items-center gap-2" x-data="{ varSearch: '' }">
                <div class="relative">
                  <details class="group">
                    <summary class="list-none px-2 py-1 text-xs rounded border border-border hover:bg-accent text-card-foreground cursor-pointer">
                      Insert variable
                    </summary>
                    <div class="absolute mt-1 z-10 bg-card border border-border rounded p-2 w-64 shadow">
                      <input type="text" class="form-control text-xs mb-2" placeholder="Search keys..." x-model="varSearch">
                      <div class="max-h-40 overflow-auto space-y-1">
                        <template x-for="k in getAllKeys(editingHint.id).filter(k => (varSearch||'') === '' || k.toLowerCase().includes(varSearch.toLowerCase()))" :key="k">
                          <button type="button" class="w-full text-left px-2 py-1 text-xs hover:bg-accent rounded" @click="editingHint.hint = (editingHint.hint || '') + ('{' + '{ ' + k + ' }' + '}'); varSearch = ''" x-text="k"></button>
                        </template>
                        <template x-if="getAllKeys(editingHint.id).length === 0">
                          <div class="text-xs text-muted-foreground px-2">No keys available yet. Use "Set key" on a question to create one.</div>
                        </template>
                      </div>
                    </div>
                  </details>
                </div>
                <button type="button" @click="editKey(editingHint.id)" class="px-2 py-1 text-xs rounded border border-border hover:bg-accent text-card-foreground">
                  Set key
                </button>
              </div>
            </div>
          </div>

          <!-- Translations Section -->
          <div x-show="hasMultipleLanguages()" class="space-y-3 border-t border-border pt-4">
            <div class="flex items-center justify-between">
              <h4 class="text-sm font-medium text-card-foreground">{% trans "Translations" %}</h4>
              <button @click="editHintTranslation(editingHint.id)"
                      class="text-xs text-primary hover:text-primary/80 transition-colors">
                <i class="fa fa-language mr-1"></i>
                Edit All Translations
              </button>
            </div>
            
            <div class="space-y-3">
              <template x-for="lang in availableLanguages.filter(l => l.code !== '{{ survey.default_language }}')" :key="lang.code">
                <div class="flex items-start gap-2">
                  <div class="flex-1 min-w-0">
                    <label class="block text-xs font-medium mb-1 text-muted-foreground"
                           x-text="lang.name + ' (' + lang.code + ')'"></label>
                    <textarea x-model="editingHint.translations[lang.code]"
                              class="form-control text-sm"
                              rows="2"
                              :placeholder="'{% trans "Enter hint translation in " %}' + lang.name"></textarea>
                  </div>
                  <button @click="saveHintTranslation(lang.code)"
                          :disabled="!editingHint.translations[lang.code] || editingHint.translations[lang.code].trim() === ''"
                          class="px-3 py-1.5 text-xs bg-secondary text-secondary-foreground rounded hover:bg-secondary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors whitespace-nowrap">
                    Save
                  </button>
                </div>
              </template>
            </div>
          </div>

          <div class="flex gap-3 pt-4 border-t border-border">
            <button @click="saveHint()"
                    class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors">
              Save Hint
            </button>
            <button x-show="getQuestionById(editingHint.id)?.hint"
                    @click="removeHint()"
                    class="px-4 py-2 border border-destructive text-destructive rounded-lg font-medium hover:bg-destructive hover:text-destructive-foreground transition-colors">
              Remove Hint
            </button>
            <button @click="editingHint = null"
                    class="px-4 py-2 border border-border rounded-lg font-medium hover:bg-accent transition-colors text-card-foreground">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
