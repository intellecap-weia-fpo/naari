{% load i18n %}
<!-- Subquestions Management Modal -->
<div x-show="showSubQuestionsModal" 
     x-cloak
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-background rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] overflow-hidden">
    <div class="flex items-center justify-between p-4 border-b border-border">
      <h3 class="text-lg font-semibold text-card-foreground">
        {% trans "Manage Sub-Questions" %}
      </h3>
      <button @click="showSubQuestionsModal = false; subQuestionsModal = null" 
              class="text-muted-foreground hover:text-card-foreground p-1 rounded">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <div class="p-4 overflow-y-auto" style="max-height: calc(80vh - 120px)">
      <template x-if="subQuestionsModal">
        <div>
          <!-- Option Info -->
          <div class="mb-4 p-3 bg-muted/20 rounded-lg">
            <h4 class="font-medium text-card-foreground" x-text="subQuestionsModal.optionText"></h4>
            <p class="text-sm text-muted-foreground">Option ID: <span x-text="subQuestionsModal.optionId"></span></p>
          </div>

          <!-- Existing Sub-Questions -->
          <div class="mb-4">
            <h4 class="font-medium text-card-foreground mb-2">{% trans "Current Sub-Questions" %}</h4>
            <template x-if="Array.isArray(subQuestionsModal.subQuestions) && subQuestionsModal.subQuestions.length > 0">
              <div class="space-y-2">
                <template x-for="(subQuestion, index) in (Array.isArray(subQuestionsModal.subQuestions) ? subQuestionsModal.subQuestions : [])">
                  <div class="flex items-center justify-between p-3 bg-muted/10 rounded-lg" :key="subQuestion.id ? subQuestion.id : ('temp-' + index)">
                    <div class="flex-1">
                      <span class="text-card-foreground" x-text="subQuestion.text"></span>
                      <span class="text-xs text-muted-foreground ml-2" 
                            x-text="'(' + subQuestion.type + (subQuestion.is_required ? ', required' : '') + ')'">
                      </span>
                    </div>
                    <div class="flex items-center gap-2">
                      <!-- Translation Status -->
                      <div x-show="hasMultipleLanguages()" class="flex items-center gap-1">
                        <div class="flex gap-1" x-data="{ translatedLangs: getTranslationStatus(subQuestion.id, 'question') }">
                          <template x-for="lang in availableLanguages.filter(l => l.code !== '{{ survey.default_language }}')" :key="lang.code">
                            <div class="w-1.5 h-1.5 rounded-full border border-border"
                                 :class="translatedLangs.some(tl => tl.code === lang.code) ? 'bg-green-500' : 'bg-gray-300'"
                                 :title="lang.name + (translatedLangs.some(tl => tl.code === lang.code) ? ' ✓' : ' ✗')">
                            </div>
                          </template>
                        </div>
                        <button @click="editTranslation(subQuestion.id, 'question')"
                                class="p-1 text-muted-foreground hover:text-primary rounded"
                                title="Translate Sub-Question">
                          <i class="fa fa-language text-xs"></i>
                        </button>
                      </div>
                      
                      <button @click="editSubQuestion(subQuestion, index)"
                              class="p-1 text-muted-foreground hover:text-primary rounded"
                              title="Edit Sub-Question">
                        <i class="fa fa-edit text-xs"></i>
                      </button>
                      
                      <!-- Options Management Button for multi-option subquestions -->
                      <button x-show="['radio', 'checkbox', 'dropdown'].includes(subQuestion.type)"
                              @click="manageSubQuestionOptions(subQuestion)"
                              class="p-1 text-muted-foreground hover:text-primary rounded"
                              title="Manage Options">
                        <i class="fa fa-cog text-xs"></i>
                      </button>
                      
                      <button @click="deleteSubQuestion(subQuestion.id, index)"
                              class="p-1 text-muted-foreground hover:text-destructive rounded"
                              title="Delete Sub-Question">
                        <i class="fa fa-trash text-xs"></i>
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!Array.isArray(subQuestionsModal.subQuestions) || subQuestionsModal.subQuestions.length === 0">
              <div class="text-center py-8 text-muted-foreground">
                <i class="fa fa-list-ul text-2xl mb-2"></i>
                <p>{% trans "No sub-questions added yet" %}</p>
              </div>
            </template>
          </div>

          <!-- Add New Sub-Question Form -->
          <div class="border-t border-border pt-4">
            <h4 class="font-medium text-card-foreground mb-3">{% trans "Add New Sub-Question" %}</h4>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-card-foreground mb-1">
                  {% trans "Question Text" %}
                </label>
                <input x-model="newSubQuestionText"
                       type="text"
                       class="w-full px-3 py-2 border border-border rounded focus:outline-none focus:border-primary"
                       placeholder="{% trans 'Enter sub-question text' %}">
              </div>
              
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-card-foreground mb-1">
                    {% trans "Question Type" %}
                  </label>
                  <select x-model="newSubQuestionType"
                          class="w-full px-3 py-2 border border-border rounded focus:outline-none focus:border-primary">
                    <option value="text">{% trans "Text" %}</option>
                    <option value="textarea">{% trans "Textarea" %}</option>
                    <option value="radio">{% trans "Radio Button" %}</option>
                    <option value="checkbox">{% trans "Checkbox" %}</option>
                    <option value="dropdown">{% trans "Dropdown" %}</option>
                    <option value="number">{% trans "Number" %}</option>
                    <option value="email">{% trans "Email" %}</option>
                    <option value="date">{% trans "Date" %}</option>
                  </select>
                </div>
                
                <div class="flex items-end">
                  <label class="flex items-center">
                    <input type="checkbox" x-model="newSubQuestionRequired" class="mr-2">
                    <span class="text-sm text-card-foreground">{% trans "Required" %}</span>
                  </label>
                </div>
              </div>
              
              <div class="flex justify-end">
                <button @click="addSubQuestion()"
                        :disabled="!newSubQuestionText.trim()"
                        class="px-4 py-2 bg-primary text-primary-foreground rounded hover:bg-primary/90 disabled:opacity-50">
                  {% trans "Add Sub-Question" %}
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <div class="flex justify-end p-4 border-t border-border">
      <button @click="showSubQuestionsModal = false; subQuestionsModal = null"
              class="px-4 py-2 text-muted-foreground hover:text-card-foreground rounded">
        {% trans "Close" %}
      </button>
    </div>
  </div>
</div>
