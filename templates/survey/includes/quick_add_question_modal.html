<!-- Quick Add Question Modal -->
<div x-show="showAddQuestion"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     @click.self="showAddQuestion = false">
  <div class="bg-card rounded-lg p-6 w-full max-w-2xl mx-4 border border-border" 
       @click.stop
       x-trap="showAddQuestion">
    <div x-show="initialized !== false">
      <h3 class="text-lg font-semibold mb-4 text-card-foreground">Add New Question</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2 text-card-foreground">Question Text</label>
          <textarea x-model="newQuestionText"
                    class="form-control"
                    rows="3"
                    placeholder="Enter your question..."
                    @keydown.enter="addQuestion()"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2 text-card-foreground">Question Type</label>
          <select x-model="newQuestionType" class="form-control">
            <option value="text">Short answer</option>
            <option value="textarea">Paragraph</option>
            <option value="radio">Multiple choice</option>
            <option value="checkbox">Checkboxes</option>
            <option value="dropdown">Dropdown</option>
            <option value="number">Number</option>
            <option value="email">Email</option>
            <option value="date">Date</option>
          </select>
        </div>

        <!-- Hint (optional) -->
        <div>
          <label class="block text-sm font-medium mb-2 text-card-foreground">Hint (optional)</label>
          <textarea x-model="newQuestionHint"
                    class="form-control"
                    rows="2"
                    placeholder="Short helper text shown under the question"></textarea>
        </div>
        
        <!-- Validation Section -->
        <div class="border border-border rounded-lg">
          <button @click="showValidationRules = !showValidationRules" 
                  class="w-full flex items-center justify-between p-3 hover:bg-accent transition-colors">
            <span class="text-sm font-semibold text-card-foreground flex items-center gap-2">
              <i class="fa fa-clipboard-check text-primary"></i>
              Validation Rules (Optional)
            </span>
            <i class="fa" :class="showValidationRules ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </button>
          
          <div x-show="showValidationRules" x-transition class="p-4 border-t border-border space-y-3">
          
          <!-- Text Length Validation (for text, textarea, email) -->
          <div id="text-validation" class="grid grid-cols-2 gap-3" x-show="['text','textarea','email'].includes(newQuestionType)">
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Min Length</label>
              <input type="number" x-model="newQuestionMinLength" class="form-control text-sm" placeholder="Min" min="0">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Max Length</label>
              <input type="number" x-model="newQuestionMaxLength" class="form-control text-sm" placeholder="Max" min="1">
            </div>
          </div>
          
          <!-- Number Range Validation (for number) -->
          <div id="number-validation" class="grid grid-cols-2 gap-3" x-show="newQuestionType === 'number'">
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Min Value</label>
              <input type="number" x-model="newQuestionMinValue" class="form-control text-sm" placeholder="Min" step="0.01">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Max Value</label>
              <input type="number" x-model="newQuestionMaxValue" class="form-control text-sm" placeholder="Max" step="0.01">
            </div>
          </div>
          
          <!-- Custom Pattern -->
          <div>
            <label class="block text-xs font-medium mb-1 text-muted-foreground">Custom Pattern (Regex)</label>
            <input type="text" x-model="newQuestionPattern" class="form-control text-sm" placeholder="e.g., ^[0-9]{3}-[0-9]{3}-[0-9]{4}$">
            <div class="text-xs text-muted-foreground mt-1">
              Examples: <code class="bg-muted px-1 rounded">^[0-9]{5}$</code> (zip code), 
              <code class="bg-muted px-1 rounded">^[A-Z]{2}[0-9]{4}$</code> (2 letters + 4 numbers)
            </div>
            <!-- Preset quick picks -->
            <div class="mt-3">
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Quick Presets</label>
              <div class="flex flex-wrap gap-2">
                <template x-for="preset in regexPresets" :key="preset.label">
                  <button type="button"
                          class="px-2 py-1 text-xs rounded border border-border hover:bg-accent text-card-foreground"
                          @click="applyRegexPreset(preset, 'add')"
                          :title="preset.message">
                    <span x-text="preset.label"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
          
          <!-- Custom Error Message -->
          <div>
            <label class="block text-xs font-medium mb-1 text-muted-foreground">Custom Error Message</label>
            <input type="text" x-model="newQuestionMessage" class="form-control text-sm" placeholder="Message shown when validation fails">
          </div>
          </div>
        </div>
        <div class="flex gap-3">
          <button @click="addQuestion()"
                  :disabled="!(newQuestionText || '').trim() || isLoading"
                  class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50">
            <span x-show="!isLoading">Add Question</span>
            <span x-show="isLoading">Adding...</span>
          </button>
          <button @click="showAddQuestion = false"
                  class="px-4 py-2 border border-border rounded-lg font-medium hover:bg-accent transition-colors text-card-foreground">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
