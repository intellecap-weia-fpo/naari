{% load i18n %}
<!-- Language Management Modal -->
<div x-show="showLanguageModal"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     @click.self="showLanguageModal = false" xmlns:x-transition="http://www.w3.org/1999/xhtml">
  <div class="bg-card rounded-xl shadow-lg w-full max-w-md mx-4 overflow-hidden border border-border flex flex-col max-h-[90vh]" 
       @click.stop
       x-trap="showLanguageModal">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-border bg-muted/30 flex items-center justify-between shrink-0">
      <div>
        <h3 class="text-lg font-semibold text-card-foreground">{% trans "Manage Languages" %}</h3>
        <p class="text-sm text-muted-foreground mt-1">{% trans "Add or remove languages for this survey" %}</p>
      </div>
      <button @click="showLanguageModal = false" class="text-muted-foreground hover:text-card-foreground transition-colors">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6 overflow-y-auto" x-show="initialized !== false">
      <div class="space-y-6">
        
        <!-- Current Languages Section -->
        <div>
          <h4 class="text-sm font-semibold text-card-foreground mb-3 flex items-center gap-2">
            <i class="fa fa-list text-primary"></i> {% trans "Current Languages" %}
          </h4>
          <div class="space-y-2 bg-muted/10 rounded-lg border border-border/50 p-2">
            <template x-for="lang in (availableLanguages || [])" :key="lang.code">
              <div class="flex items-center justify-between p-2.5 bg-background rounded-md border border-border shadow-sm group">
                <span class="text-sm font-medium text-card-foreground flex items-center gap-2"
                      x-text="lang.name + (lang.is_default ? ' ({% trans "Default" %})' : '')"></span>
                <template x-if="!lang.is_default">
                  <button type="button" 
                          @click.prevent="removeLanguage(lang.code)"
                          class="text-xs font-semibold text-destructive hover:bg-destructive/10 px-2.5 py-1.5 rounded transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100">
                    <i class="fa fa-trash mr-1"></i> {% trans "Remove" %}
                  </button>
                </template>
              </div>
            </template>
            <!-- Show message if only default language -->
            <template x-if="(availableLanguages || []).length === 1">
              <p class="text-sm text-muted-foreground italic px-2 py-1">{% trans "Only default language available." %}</p>
            </template>
          </div>
        </div>
        
        <!-- Add Language Section -->
        <div>
          <h4 class="text-sm font-semibold text-card-foreground mb-3 flex items-center gap-2">
            <i class="fa fa-plus-circle text-primary"></i> {% trans "Add Language" %}
          </h4>
          <div class="flex gap-2">
            <select x-model="newLanguage" class="form-control flex-1">
              <option value="">{% trans "Select a language..." %}</option>
              <!-- Show Django default options, but ONLY if they are not in availableLanguages -->
              {% for code, name in LANGUAGES %}
                <option value="{{ code }}" 
                        x-show="!availableLanguages.some(l => l.code === '{{ code }}')">
                  {{ name }}
                </option>
              {% endfor %}
            </select>
            <button @click="addLanguage()"
                    :disabled="!newLanguage || isLoading"
                    class="px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap shadow-sm">
              <span x-show="!isLoading">{% trans "Add" %}</span>
              <span x-show="isLoading" class="flex items-center gap-2"><i class="fa fa-spinner fa-spin"></i></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-4 border-t border-border bg-muted/10 shrink-0 flex justify-end">
      <button @click="showLanguageModal = false"
              class="px-5 py-2.5 bg-background border border-border rounded-lg font-medium hover:bg-accent text-card-foreground transition-colors shadow-sm">
        {% trans "Done" %}
      </button>
    </div>
  </div>
</div>
