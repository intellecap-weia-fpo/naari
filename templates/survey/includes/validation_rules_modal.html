<!-- Validation Rules Modal -->
<div x-show="editingValidation"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     @click.self="editingValidation = null">
  <div class="bg-card rounded-lg p-6 w-full max-w-2xl mx-4 border border-border max-h-[90vh] overflow-y-auto"
       @click.stop
       x-trap="editingValidation">
    <div x-show="editingValidation">
      <h3 class="text-lg font-semibold mb-4 text-card-foreground flex items-center gap-2">
        <i class="fa fa-clipboard-check text-primary"></i>
        Validation Rules
      </h3>

      <div class="space-y-4">
        <!-- Question Info -->
        <template x-if="editingValidation">
          <div class="bg-muted/50 rounded-lg p-3">
            <p class="text-sm text-muted-foreground mb-1">Question:</p>
            <p class="font-medium text-card-foreground" x-text="getQuestionById(editingValidation.id)?.text || ''"></p>
            <p class="text-xs text-muted-foreground mt-1" x-text="'Type: ' + (getQuestionById(editingValidation.id)?.type_display || '')"></p>
          </div>
        </template>

        <!-- Text Length Validation -->
        <template x-if="editingValidation && ['text', 'textarea', 'email'].includes(getQuestionById(editingValidation.id)?.type)">
          <div>
            <h4 class="text-sm font-semibold mb-2 text-card-foreground">Text Length</h4>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium mb-1 text-muted-foreground">Min Length</label>
                <input type="number" x-model="editingValidation.min_length" class="form-control text-sm" placeholder="Min" min="0">
              </div>
              <div>
                <label class="block text-xs font-medium mb-1 text-muted-foreground">Max Length</label>
                <input type="number" x-model="editingValidation.max_length" class="form-control text-sm" placeholder="Max" min="1">
              </div>
            </div>
          </div>
        </template>

        <!-- Number Range Validation -->
        <template x-if="editingValidation && getQuestionById(editingValidation.id)?.type === 'number'">
          <div>
            <h4 class="text-sm font-semibold mb-2 text-card-foreground">Number Range</h4>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium mb-1 text-muted-foreground">Min Value</label>
                <input type="number" x-model="editingValidation.min_value" class="form-control text-sm" placeholder="Min" step="0.01">
              </div>
              <div>
                <label class="block text-xs font-medium mb-1 text-muted-foreground">Max Value</label>
                <input type="number" x-model="editingValidation.max_value" class="form-control text-sm" placeholder="Max" step="0.01">
              </div>
            </div>
          </div>
        </template>

        <!-- Custom Pattern -->
        <template x-if="editingValidation">
          <div>
            <h4 class="text-sm font-semibold mb-2 text-card-foreground">Custom Pattern</h4>
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Regular Expression</label>
              <input type="text" x-model="editingValidation.validation_pattern" class="form-control text-sm" placeholder="e.g., ^[0-9]{3}-[0-9]{3}-[0-9]{4}$">
              <div class="text-xs text-muted-foreground mt-1">
                Examples: <code class="bg-muted px-1 rounded">^[0-9]{5}$</code> (zip code),
                <code class="bg-muted px-1 rounded">^[A-Z]{2}[0-9]{4}$</code> (2 letters + 4 numbers)
              </div>
              <!-- Preset quick picks -->
              <div class="mt-3">
                <label class="block text-xs font-medium mb-1 text-muted-foreground">Quick Presets</label>
                <div class="flex flex-wrap gap-2">
                  <template x-for="preset in regexPresets" :key="preset.label">
                    <button type="button"
                            class="px-2 py-1 text-xs rounded border border-border hover:bg-accent text-card-foreground"
                            @click="applyRegexPreset(preset, 'edit')"
                            :title="preset.message">
                      <span x-text="preset.label"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Custom Error Message -->
        <template x-if="editingValidation">
          <div>
            <h4 class="text-sm font-semibold mb-2 text-card-foreground">Error Message</h4>
            <div>
              <label class="block text-xs font-medium mb-1 text-muted-foreground">Custom Message</label>
              <input type="text" x-model="editingValidation.validation_message" class="form-control text-sm" placeholder="Message shown when validation fails">
            </div>
          </div>
        </template>

        <!-- Actions -->
        <div class="flex gap-3 pt-4 border-t border-border">
          <button @click="saveValidation()"
                  class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors">
            Save Validation Rules
          </button>
          <button @click="editingValidation = null"
                  class="px-4 py-2 border border-border rounded-lg font-medium hover:bg-accent transition-colors text-card-foreground">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
