<!-- Bulk Translate Modal -->
<div x-show="showBulkTranslateModal"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     @click.self="showBulkTranslateModal = false">
  <div class="bg-card rounded-lg p-6 w-full max-w-md mx-4 border border-border"
       @click.stop
       x-trap="showBulkTranslateModal">
    <div>
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-card-foreground">
          Auto Translate Survey
        </h3>
        <button @click="showBulkTranslateModal = false"
                class="text-muted-foreground hover:text-card-foreground transition-colors">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2 text-card-foreground">Target Language</label>
          <select x-model="bulkTranslateLanguage" class="form-control w-full">
            <option value="">Select language...</option>
            <template x-for="lang in availableLanguages.filter(l => l.code !== '{{ survey.default_language }}')" :key="lang.code">
              <option :value="lang.code" x-text="lang.name + ' (' + lang.code + ')'"></option>
            </template>
          </select>
        </div>

        <div class="bg-warning/20 border border-warning/30 rounded-lg p-3 text-sm">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa fa-exclamation-triangle text-warning"></i>
            <span class="font-medium text-warning-foreground">Important</span>
          </div>
          <p class="text-warning-foreground/80">
            This will automatically translate all questions and options in the survey to the selected language using AI.
            Existing translations will be overwritten.
          </p>
        </div>

        <!-- Progress Bar (hidden by default) -->
        <div x-show="bulkTranslateProgress.total > 0" class="pt-4 border-t border-border">
          <div class="mb-2 flex justify-between text-sm text-card-foreground">
            <span>Progress: <span x-text="bulkTranslateProgress.completed"></span>/<span x-text="bulkTranslateProgress.total"></span></span>
            <span x-text="Math.round((bulkTranslateProgress.completed / bulkTranslateProgress.total) * 100) + '%'"></span>
          </div>
          <div class="w-full bg-muted rounded-full h-2">
            <div class="bg-primary h-2 rounded-full transition-all duration-300"
                 :style="'width: ' + (bulkTranslateProgress.total > 0 ? (bulkTranslateProgress.completed / bulkTranslateProgress.total) * 100 : 0) + '%'"></div>
          </div>
          <div class="mt-1 text-xs text-muted-foreground" x-text="bulkTranslateProgress.currentItem"></div>
        </div>

        <div class="flex gap-3 pt-4 border-t border-border">
          <button @click="autoTranslateSurvey()"
                  :disabled="isLoading || !bulkTranslateLanguage || bulkTranslateProgress.total > 0"
                  class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50">
            <span x-show="!isLoading && bulkTranslateProgress.total === 0">Translate Survey</span>
            <span x-show="isLoading || bulkTranslateProgress.total > 0">Translating...</span>
          </button>
          
          <button @click="showBulkTranslateModal = false"
                  :disabled="bulkTranslateProgress.total > 0"
                  class="px-4 py-2 border border-border rounded-lg font-medium hover:bg-accent transition-colors text-card-foreground disabled:opacity-50">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
