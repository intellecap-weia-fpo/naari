<!-- Evaluator Condition Modal (for consent questions) -->
<template x-if="showEvaluatorModal">
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-3" @click.self="showEvaluatorModal = false">
    <div class="bg-card rounded-md shadow-lg max-w-md w-full overflow-hidden">
      <div class="flex items-center justify-between p-3 border-b border-border">
        <h3 class="text-base font-semibold text-card-foreground">Evaluator Condition</h3>
        <button @click="showEvaluatorModal = false" class="p-1.5 text-muted-foreground hover:text-destructive rounded-full"><i class="fa fa-times text-sm"></i></button>
      </div>
      <div class="p-3 space-y-2">
        <p class="text-xs text-muted-foreground">Optional flag/expression used by evaluators (applies to consent questions).</p>
        <input type="text" x-model="editingEvaluator.evaluator_condition" class="w-full px-2.5 py-1.5 bg-background border border-border rounded text-card-foreground focus:outline-none focus:border-primary text-sm" placeholder="Enter evaluator condition (optional)">
      </div>
      <div class="p-3 border-t border-border flex justify-end gap-2">
        <button @click="showEvaluatorModal = false" class="px-3 py-1.5 border border-border text-card-foreground rounded hover:bg-accent text-sm">Cancel</button>
        <button @click="saveEvaluatorCondition()" class="px-3 py-1.5 bg-primary text-primary-foreground rounded hover:bg-primary/90 text-sm">Save</button>
      </div>
    </div>
  </div>
  
</template>
