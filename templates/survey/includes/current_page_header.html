<!-- Current Page Header -->
{% load i18n %}
<template x-if="currentPage">
  <div class="bg-card rounded-lg border border-border mb-6 overflow-hidden">
    <div class="p-6">
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <h2 class="text-xl font-medium text-card-foreground"
              x-text="currentPage.title || `{% trans 'Page' %} ${getCurrentPageIndex() + 1}`"></h2>
          <p class="text-muted-foreground text-sm mt-1"
             x-text="currentPage.description || '{% trans 'No description provided' %}'"></p>
          <div class="flex items-center gap-4 mt-3 text-sm text-muted-foreground">
            <span class="flex items-center gap-1">
              <i class="fa fa-question-circle"></i>
              <span x-text="(currentPage.questions?.length || 0) + ' {% trans 'questions' %}'"></span>
            </span>
            <span class="flex items-center gap-1">
              <i class="fa fa-sort-numeric-down"></i>
              <span x-text="'{% trans 'Position' %} ' + (getCurrentPageIndex() + 1) + ' {% trans 'of' %} ' + pages.length"></span>
            </span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <template x-if="hasMultipleLanguages()">
            <button @click="editPageTranslation(currentPage.id)"
                    class="p-2 border-0 bg-transparent rounded-lg text-muted-foreground hover:bg-accent hover:text-primary transition-all"
                    title="Translate Page">
              <i class="fa fa-language"></i>
            </button>
          </template>
          <a :href="`/survey/page/${currentPage.id}/edit/`"
             class="p-2 border-0 bg-transparent rounded-lg text-muted-foreground hover:bg-accent hover:text-primary transition-all"
             title="Edit Page">
            <i class="fa fa-edit"></i>
          </a>
          <template x-if="pages.length > 1">
            <a :href="`/survey/page/${currentPage.id}/delete/`"
               class="p-2 border-0 bg-transparent rounded-lg text-muted-foreground hover:bg-accent hover:text-destructive transition-all"
               title="Delete Page">
              <i class="fa fa-trash"></i>
            </a>
          </template>
        </div>
      </div>
    </div>
  </div>
</template>
